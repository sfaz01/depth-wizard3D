name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies (no PyTorch needed for the test suite)
        run: |
          grep -v -E "^(transformers)" requirements.txt > req-ci.txt
          pip install -r req-ci.txt
      - name: Run tests
        env:
          DW_LLM: "0"
          DW_OSM: "0"
        run: python -m pytest tests -q
